name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: 密钥泄露扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 浏览器从 Playwright 的服务器下，系统依赖走 Ubuntu 软件源。测试机偶尔解析不了软件源域名（2026-11-11 连着两次），
      # 这时不中断：测试机镜像自带 Chrome，需要的库基本都有；真缺库的话下一步测试会直接报错
      - run: npx playwright install chromium
      - run: npx playwright install-deps chromium || echo "::warning::系统依赖没装上（软件源连不上），用测试机自带的库继续"
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
